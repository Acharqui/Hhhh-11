name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # استخدام SDK المثبت مسبقاً في GitHub Actions
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config cmake build-essential \
            libffi-dev libssl-dev \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            uuid-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev

      - name: Install Android SDK and accept licenses
        run: |
          # استخدام SDK المثبت مسبقاً في GitHub Actions
          # قبول جميع التراخيص
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # تثبيت الأدوات المطلوبة
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Link SDK for Buildozer
        run: |
          # إنشاء هيكل المجلدات لـ Buildozer
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          
          # ربط SDK الفعلي مع المجلد الذي يتوقعه Buildozer
          ln -sf ${ANDROID_SDK_ROOT}/* /home/runner/.buildozer/android/platform/android-sdk/ || true
          ln -sf ${ANDROID_SDK_ROOT}/cmdline-tools/latest /home/runner/.buildozer/android/platform/android-sdk/tools
          
          # إنشاء مجلد tools/bin إذا لم يكن موجوداً
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          
          # إنشاء رابط لـ sdkmanager
          if [ ! -f /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager ]; then
            ln -sf ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          fi

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.37
          pip install buildozer

      - name: Create buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          # تحديث الإعدادات
          sed -i 's/^android.api = .*/android.api = 34/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
          sed -i 's/^android.ndk = .*/android.ndk = 26.3.11579264/' buildozer.spec
          sed -i 's/^# android.sdk_path = .*/android.sdk_path = \/home\/runner\/.buildozer\/android\/platform\/android-sdk/' buildozer.spec

      - name: Build APK
        run: |
          # استخدام SDK الفعلي
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}
          
          # بناء التطبيق
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
