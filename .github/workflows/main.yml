name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config cmake build-essential \
            libffi-dev libssl-dev \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            uuid-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev

      - name: Install Android SDK and accept licenses
        run: |
          # قبول جميع التراخيص
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # تثبيت الأدوات المطلوبة
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Setup Buildozer environment
        run: |
          # إنشاء الروابط اللازمة
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          ln -sf ${ANDROID_SDK_ROOT}/build-tools /home/runner/.buildozer/android/platform/android-sdk/build-tools
          ln -sf ${ANDROID_SDK_ROOT}/platforms /home/runner/.buildozer/android/platform/android-sdk/platforms
          ln -sf ${ANDROID_SDK_ROOT}/platform-tools /home/runner/.buildozer/android/platform/android-sdk/platform-tools
          ln -sf ${ANDROID_SDK_ROOT}/ndk /home/runner/.buildozer/android/platform/android-sdk/ndk

      - name: Verify SDK installation
        run: |
          echo "Checking build-tools:"
          ls -la ${ANDROID_SDK_ROOT}/build-tools/
          echo "Checking aidl:"
          find ${ANDROID_SDK_ROOT} -name aidl || echo "aidl not found"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.37
          pip install buildozer

      - name: Initialize Buildozer if needed
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "Creating buildozer.spec..."
            buildozer init
          else
            echo "buildozer.spec found"
          fi

      - name: Build APK
        run: |
          # تعيين متغيرات البيئة للتأكد
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}
          export ANDROID_HOME=${ANDROID_HOME}
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
