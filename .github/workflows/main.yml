name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28c
      ANDROID_API: 34
      ANDROID_MIN_API: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config cmake build-essential \
            libffi-dev libssl-dev \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            uuid-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev

      - name: Install Android SDK and accept licenses
        run: |
          # قبول جميع التراخيص
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # تثبيت الأدوات المطلوبة
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Setup Buildozer SDK structure
        run: |
          # إنشاء هيكل المجلدات
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          
          # ربط المجلدات
          ln -sf /usr/local/lib/android/sdk/cmdline-tools /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest /home/runner/.buildozer/android/platform/android-sdk/tools
          ln -sf /usr/local/lib/android/sdk/build-tools /home/runner/.buildozer/android/platform/android-sdk/build-tools
          ln -sf /usr/local/lib/android/sdk/platforms /home/runner/.buildozer/android/platform/android-sdk/platforms
          ln -sf /usr/local/lib/android/sdk/platform-tools /home/runner/.buildozer/android/platform/android-sdk/platform-tools

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.37
          pip install buildozer

      - name: Create or update buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          
          # تحديث الإعدادات في buildozer.spec
          sed -i 's/^android.api = .*/android.api = 34/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
          sed -i 's/^android.ndk = .*/android.ndk = 26.3.11579264/' buildozer.spec
          sed -i 's/^# android.sdk_path = .*/android.sdk_path = \/home\/runner\/.buildozer\/android\/platform\/android-sdk/' buildozer.spec

      - name: Verify configuration
        run: |
          echo "=== buildozer.spec settings ==="
          grep -E "android.api|android.minapi|android.ndk|android.sdk_path" buildozer.spec || true
          
          echo "=== SDK structure ==="
          ls -la /home/runner/.buildozer/android/platform/android-sdk/
          
          echo "=== NDK status ==="
          ls -la /home/runner/.buildozer/android/platform/ | grep ndk || echo "NDK not downloaded yet"

      - name: Build APK
        run: |
          # تعيين المتغيرات البيئية
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          export PATH=${ANDROID_SDK_ROOT}/tools/bin:${PATH}
          
          # بناء التطبيق
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
